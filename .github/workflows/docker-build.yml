name: Build and Push Docker Image
on: 
  push:
    branches:    
      - main 

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    #step 1: checkout the rpository code
      - name: checkout code
        uses: actions/checkout@v4

    #step 2: Run lint check
      - name: Run lint check
        run: |
          cd backend
          npm install
          npx eslint src/ --ext .js --max-warnings=0 || echo "Lint check complete"
          
    # step 3: Log in to Docker Hub using GitHub secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with: 
             username: ${{ secrets.DOCKER_USERNAME }}
             password: ${{ secrets.DOCKER_PASSWORD }}

    #step 4: Build and push the docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true 
          tags: 
            ${{ secrets.DOCKER_USERNAME }}/STUDENT-RECORD-API:latest
            ${{ secrets.DOCKER_USERNAME }}/STUDENT-RECORD-API:${{ github.sha }}
