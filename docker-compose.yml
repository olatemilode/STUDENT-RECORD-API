version: "3.8"

services:
  mongo: 
    image: mongo6
    container_name: student-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-backend
    ports:
      -5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/studentDB
    depends_on:
      - mongo
       
  frontend:
    image: node:18-alpine
    container_name: student-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm start"
    depends_on:
      - backend
  volumes:
    mongo-data
    